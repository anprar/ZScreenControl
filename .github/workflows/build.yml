name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opsional: isi secrets ini kalau mau APK rilis bertanda tangan.
  # Kalau kosong, hanya APK debug yang dibangun.
  RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Repo boleh berisi project Gradle di root, atau di sub-folder "android/".
      - name: Detect Gradle project directory
        id: detect
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f android/gradlew ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "gradlew tidak ditemukan di root maupun android/" >&2
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x "${{ steps.detect.outputs.dir }}/gradlew"

      - name: Build debug APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZScreenControl-debug-apk
          path: ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---------- Opsional: rilis bertanda tangan ----------

      - name: Decode release keystore
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"

      - name: Build release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          ZSC_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          ZSC_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZSC_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZSC_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ZScreenControl-release-apk
          path: ${{ steps.detect.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
